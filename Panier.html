<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page - Église Évangélique de Dakar</title>
    <style>
        /* public-styles.css */
        :root {
            --blue: #007bff;
            --red: #dc3545;
            --dark-bg: #121212;
            --dark-card: #1e1e1e;
            --text-light: #f8f9fa;
            --text-secondary: #adb5bd;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            /* Application du dégradé sur tout l'arrière-plan */
            background: linear-gradient(120deg, var(--blue) 0%, var(--red) 100%);
            background-attachment: fixed; /* Le dégradé reste fixe au défilement */
            color: var(--text-light);
            font-size: 16px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Barre de Navigation Améliorée */
        header {
            background-color: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            padding: 10px 0; /* Hauteur réduite */
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-color);
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            font-size: 1.5em;
            color: var(--text-light);
            text-decoration: none;
        }

        .logo img {
            transition: transform 0.3s ease;
        }

        .logo:hover img {
            transform: scale(1.05);
        }

        nav ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
            position: relative;
            padding-bottom: 5px;
        }

        nav ul a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: 0;
            left: 50%;
            background: linear-gradient(90deg, var(--blue), var(--red));
            transition: all 0.3s ease-in-out;
        }

        nav ul a:hover::after {
            width: 100%;
            left: 0;
        }

        nav a:hover, .nav-actions a.primary {
            color: var(--text-light);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-actions a.primary {
            background: linear-gradient(90deg, var(--blue), var(--red));
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        /* Sections Générales */
        section {
            padding: 80px 0;
        }

        h1, h2, h3 {
            line-height: 1.2;
        }

        .section-title {
            text-align: center;
            font-size: 2.8em;
            margin-bottom: 10px;
        }

        .section-subtitle {
            text-align: center;
            font-size: 1.1em;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 60px auto;
        }

        /* Section Hero spécifique */
        .hero {
            padding-top: 60px;
            padding-bottom: 60px;
        }
        .hero-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }
        .hero-video video {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        /* Cartes Produit spécifiques */
        .product-card .price {
            font-size: 2em;
            font-weight: bold;
            margin: 20px 0;
        }
        .price span {
            font-size: 0.5em;
            font-weight: normal;
            color: var(--text-secondary);
        }

        /* Grilles et Cartes */
        .grid-2, .grid-3 {
            display: grid;
            gap: 30px;
        }
        .grid-2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

        .card {
            background-color: var(--dark-card);
            padding: 30px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .card h3 {
            color: var(--blue);
            margin-top: 0;
        }

        /* Boutons */
        .btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            padding: 12px;
            background: var(--blue);
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: transform 0.2s, opacity 0.2s;
            border: none;
            cursor: pointer;
            font-size: 1em;
        }
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .btn-gradient {
            background: linear-gradient(90deg, var(--blue), var(--red));
        }

        /* Responsive */
        @media (max-width: 768px) {
            nav ul {
                display: none; /* Cacher pour un menu burger en JS */
            }
            .section-title {
                font-size: 2.2em;
            }
            .hero-content {
                grid-template-columns: 1fr;
            }
            nav ul, .nav-contact-info { display: none; }
            .nav-actions a#cart-link { display: none; } /* Cache le panier */
            .nav-actions a.primary { display: none; } /* Cache la connexion */

            .menu-burger { display: block; }
            .logo img { height: 50px !important; }
        }

        /* Styles spécifiques au panier */
        .cart-item {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .cart-item-details { flex-grow: 1; }
        .cart-item-actions { display: flex; align-items: center; gap: 10px; }
        .quantity-input { width: 50px; text-align: center; background-color: #333; border: 1px solid #555; color: white; border-radius: 4px; }
        .remove-btn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 1.2em; }

        .cart-total {
            margin-top: 30px;
            text-align: right;
            font-size: 1.5em;
        }
        .checkout-btn {
            float: right;
            margin-top: 20px;
            width: auto;
            padding: 12px 30px;
        }
        .menu-burger { display: none; cursor: pointer; font-size: 1.8em; }
        .nav-links-mobile { display: none; }

    </style>
</head>
<body>
    <header>
        <nav class="container">
            <a href="index.html" class="logo"><img src="r/logo.png" alt="Logo Église Évangélique de Dakar" style="height: 50px; vertical-align: middle;"></a>
            <ul class="desktop-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="apropos.html">À Propos</a></li>
                <li><a href="evenements.html">Événements</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="ressources.html">Ressources</a></li>
                <li><a href="live.html">Live</a></li>
                <li><a href="Boutique.html">Faire un Don</a></li>
                <li><a href="index.html#contact">Contact</a></li>
            </ul>
            <button class="menu-burger" onclick="toggleMobileMenu()" aria-label="Ouvrir le menu de navigation">☰</button>
        </nav>
    </header>

    <div class="nav-links-mobile">
        <a href="index.html" onclick="toggleMobileMenu()">Accueil</a>
        <a href="apropos.html" onclick="toggleMobileMenu()">À Propos</a>
        <a href="evenements.html" onclick="toggleMobileMenu()">Événements</a>
        <a href="blog.html" onclick="toggleMobileMenu()">Blog</a>
        <a href="ressources.html" onclick="toggleMobileMenu()">Ressources</a>
        <a href="live.html" onclick="toggleMobileMenu()">Live</a>
        <a href="Boutique.html" onclick="toggleMobileMenu()">Faire un Don</a>
        <a href="index.html#contact" onclick="toggleMobileMenu()">Contact</a>
    </div>

    <main>
        <section class="container">
            <h1 class="section-title">Page en construction</h1>
            <p class="section-subtitle">Ce contenu sera bientôt disponible.</p>
        </section>
    </main>

    <script src="config.js"></script>

    <script>
        function toggleMobileMenu() {
            const mobileMenu = document.querySelector('.nav-links-mobile');
            const burgerIcon = document.querySelector('.menu-burger');
            const body = document.body;

            mobileMenu.classList.toggle('active');
            body.classList.toggle('no-scroll');

            if (mobileMenu.classList.contains('active')) {
                burgerIcon.innerHTML = '✕'; // Icône de fermeture
            } else {
                burgerIcon.innerHTML = '☰';
            }
        }
    </script>
</body>
</html>
