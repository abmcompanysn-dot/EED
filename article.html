<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Lumière du Futur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="footer.css">
    <style>
        .container { max-width: 900px; }
        .article-header { text-align: center; margin-bottom: 40px; }
        .article-title { font-size: 3em; color: var(--primary-blue); margin-bottom: 15px; }
        .article-meta { color: var(--text-secondary); }
        .article-image { width: 100%; height: auto; max-height: 450px; object-fit: cover; border-radius: 10px; margin-bottom: 40px; }
        .article-content { line-height: 1.8; font-size: 1.1em; }
        
        /* --- Nouveaux styles pour le contenu de l'article --- */
        .article-content p { 
            margin-bottom: 1.5em; 
        }
        .article-content h3 { 
            margin-top: 2.5em;
            margin-bottom: 1em;
            color: var(--primary-blue);
            font-size: 1.4em;
            border-left: 3px solid var(--primary-red);
            padding-left: 15px;
        }
        .article-content blockquote { 
            font-size: 1.2em;
            font-style: italic;
            margin: 2em 20px;
            padding: 20px;
            border-left: 5px solid var(--primary-blue);
            background-color: var(--card-bg);
            border-radius: 0 8px 8px 0;
        }
        .article-content blockquote footer {
            font-style: normal;
            font-size: 0.8em;
            text-align: right;
            color: var(--text-secondary);
            margin-top: 10px;
        }
        .cle-lecture { 
            background-color: rgba(44, 44, 84, 0.5);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin: 2em 0;
            text-align: center;
            font-style: italic;
        }

        /* --- Nouveaux styles pour les boutons de partage --- */
        .share-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }
        .share-section h3 {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s;
            cursor: pointer; 
        }
        .share-btn:hover { opacity: 0.85; }
        .share-btn.facebook { background-color: #1877F2; }
        .share-btn.whatsapp { background-color: #25D366; }

        /* --- Styles pour la section des commentaires --- */
        .comments-section {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 10px;
            margin-top: 60px;
        }
        .comments-section h2 {
            color: var(--text-dark);
            margin-bottom: 30px;
            text-align: center;
        }
        .comment-item {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-author {
            font-weight: bold;
            color: var(--primary-blue);
            margin-bottom: 5px;
        }
        .comment-date {
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        /* Styles pour le formulaire de commentaire */
        .comment-form {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .comment-form label {
            color: var(--text-dark);
            font-weight: 600;
        }
        .comment-form input[type="text"],
        .comment-form textarea {
            background-color: var(--light-bg);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 10px 15px;
            color: var(--text-dark);
            font-family: 'Open Sans', sans-serif;
            font-size: 1em;
        }
        .comment-form textarea { min-height: 100px; }
        /* Styles pour le skeleton loader de l'article */
        .skeleton-article .skeleton-line {
            height: 1em; background-color: #e0e0e0;
            border-radius: 4px;
            margin: 0 auto 15px auto;
            animation: pulse 1.5s infinite ease-in-out;
        }
        .skeleton-article .title { height: 2.5em; width: 70%; margin-bottom: 20px; }
        .skeleton-article .meta { height: 1em; width: 40%; margin-bottom: 40px; }
        .skeleton-article .image { height: 400px; width: 100%; background-color: #e0e0e0; border-radius: 10px; margin-bottom: 40px; animation: pulse 1.5s infinite ease-in-out; }
        .skeleton-article .text { width: 100%; }
        .skeleton-article .text.short { width: 80%; }

        @keyframes pulse {
            0% { background-color: #e0e0e0; }
            50% { background-color: #f0f0f0; }
            100% { background-color: #e0e0e0; }
        }

        /* MEDIA QUERIES pour le mobile */
        @media (max-width: 768px) {
            .article-title {
                font-size: 2em; /* Réduire la taille du titre sur mobile */
            }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo"><img src="r/LOGO.svg" alt="Logo Église Évangélique de Dakar"/></a>
            <ul class="desktop-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="apropos.html">À Propos</a></li>
                <li><a href="ministeres.html">Ministères</a></li>
                <li><a href="evenements.html">Événements</a></li>
                <li><a href="demande-priere.html">Demande de Prière</a></li>
                <li><a href="blog.html" class="active">Blog</a></li>
                <li><a href="ressources.html">Ressources</a></li>
                <li><a href="live.html">Live</a></li>
                <li><a href="Boutique.html">Faire un Don</a></li>
                <li><a href="apropos.html#contact">Contact</a></li>
            </ul>
            <div class="menu-burger" onclick="toggleMobileMenu()">
                <span class="bar bar1"></span>
                <span class="bar bar2"></span>
                <span class="bar bar3"></span>
            </div>
        </nav>
    </header>

    <div class="nav-links-mobile" id="mobile-menu">
        <!-- Le contenu est généré par main.js -->
    </div>

    <main class="container" id="article-container">
    </main>

    <footer class="footer-section">
        <!-- Le contenu du pied de page sera généré ici -->
    </footer>

    <script src="config.js"></script>
    <script src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('article-container');
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            // Peuple le menu mobile et le footer
            populateMobileMenu();
            populateFooter();
            
            // Afficher le skeleton loader
            container.innerHTML = `
                <div class="skeleton-article">
                    <div class="skeleton-line title"></div>
                    <div class="skeleton-line meta"></div>
                    <div class="skeleton-image"></div>
                    <div class="skeleton-line text"></div>
                    <div class="skeleton-line text"></div>
                    <div class="skeleton-line text short"></div>
                    <br>
                    <div class="skeleton-line text"></div>
                    <div class="skeleton-line text short"></div>
                </div>
            `;

            if (!articleId) {
                container.innerHTML = '<p class="loading-message">Erreur : Aucun article spécifié.</p>';
                return;
            }

            if (typeof callApi === 'undefined') {
                 console.error("La fonction callApi n'est pas définie.");
                 container.innerHTML = '<p class="loading-message">Erreur interne : La connexion à l\'API n\'est pas configurée.</p>';
                 return;
            }

            callApi('getBlogPostById', { id: articleId })
                .then(data => {
                    if (data.success && data.post) {
                        const post = data.post;
                        document.title = `${post.Titre} - Lumière du Futur`;

                        const postDate = new Date(post.Date).toLocaleDateString('fr-FR', {
                            day: 'numeric', month: 'long', year: 'numeric'
                        });

                        const formattedContent = formatContent(post.Contenu);

                        container.innerHTML = `
                            <article>
                                <header class="article-header">
                                    <h1 class="article-title">${post.Titre}</h1>
                                    <p class="article-meta">Par ${post.Auteur} • ${postDate}</p>
                                </header>
                                <img src="${post.ImageURL}" alt="Image pour ${post.Titre}" class="article-image">
                                <div class="article-content">
                                    ${formattedContent}
                                </div>
                                <footer class="share-section">
                                    <h3>Partager cet article</h3>
                                    <div class="share-buttons">
                                        <a id="share-facebook" href="#" target="_blank" class="share-btn facebook">Facebook</a>
                                        <a id="share-whatsapp" href="#" target="_blank" class="share-btn whatsapp">WhatsApp</a>
                                    </div>
                                </footer>

                                <section class="comments-section">
                                    <h2>Commentaires</h2>
                                    <div id="comments-list">
                                        <p style="text-align: center; color: var(--text-secondary);">Chargement des commentaires...</p>
                                    </div>
                                    <form id="comment-form" class="comment-form">
                                        <h3>Laisser un commentaire</h3>
                                        <label for="comment-author">Votre nom :</label>
                                        <input type="text" id="comment-author" name="author" required>
                                        <label for="comment-text">Votre commentaire :</label>
                                        <textarea id="comment-text" name="commentText" required></textarea>
                                        <button type="submit" class="share-btn" style="background: var(--primary-blue); border: none;">Envoyer</button>
                                    </form>
                                </section>
                            </article>
                        `;

                        // Logique pour mettre à jour les liens de partage
                        const pageUrl = window.location.href;
                        const shareText = encodeURIComponent(`Découvrez cet article : "${post.Titre}"`);

                        document.getElementById('share-facebook').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}`;
                        document.getElementById('share-whatsapp').href = `https://api.whatsapp.com/send?text=${shareText} ${encodeURIComponent(pageUrl)}`;

                        // Charger les commentaires et attacher l'événement au formulaire
                        loadComments(articleId);
                        document.getElementById('comment-form').addEventListener('submit', function(event) {
                            event.preventDefault();
                            submitComment(articleId);
                        });

                    } else {
                        container.innerHTML = `<p class="loading-message">Erreur : Article non trouvé. (${data.error || ''})</p>`;
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    container.innerHTML = '<p class="loading-message">Impossible de charger l\'article. Veuillez réessayer plus tard.</p>';
                });
        });

        // --- FONCTION: Formatage sémantique du contenu brut ---
        function formatContent(content) {
            const lines = content.trim().split('\n');
            let html = '';
            let inParagraph = false;

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('###')) {
                    if (inParagraph) { html += '</p>'; inParagraph = false; }
                    html += `<h3>${line.substring(3).trim()}</h3>`;
                } else if (line.startsWith('>')) {
                    if (inParagraph) { html += '</p>'; inParagraph = false; }
                    const citation = line.substring(1).trim().split('--');
                    const text = citation[0].trim();
                    const source = citation[1] ? `<footer>${citation[1].trim()}</footer>` : '';
                    html += `<blockquote>${text}${source}</blockquote>`;
                } else if (line.length > 0) {
                    if (!inParagraph) { html += '<p>'; inParagraph = true; }
                    html += line + ' ';
                } else {
                    if (inParagraph) { html += '</p>'; inParagraph = false; }
                }
            });

            if (inParagraph) { html += '</p>'; }
            return html;
        }

        /**
         * Charge et affiche les commentaires pour un article spécifique.
         */
        function loadComments(articleId) {
            const commentsList = document.getElementById('comments-list');
            commentsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Chargement des commentaires...</p>';

            callApi('getComments', { articleId: articleId })
                .then(data => {
                    commentsList.innerHTML = ''; 
                    if (data.success && data.comments && data.comments.length > 0) {
                        const approvedComments = data.comments.filter(c => c.Statut === 'Approuvé');

                        if (approvedComments.length > 0) {
                            approvedComments.forEach(comment => { 
                                const commentElement = document.createElement('div');
                                commentElement.classList.add('comment-item');
                                commentElement.innerHTML = `
                                    <p class="comment-author">${comment.Auteur || 'Anonyme'}</p>
                                    <p>${comment.Commentaire}</p>
                                    <p class="comment-date">${new Date(comment.Timestamp).toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
                                `;
                                commentsList.appendChild(commentElement);
                            });
                        } else {
                             commentsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Aucun commentaire approuvé pour le moment. Soyez le premier !</p>';
                        }
                    } else {
                        commentsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Aucun commentaire pour le moment. Soyez le premier !</p>';
                    }
                })
                .catch(error => {
                    console.error('Erreur lors du chargement des commentaires:', error);
                    commentsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Impossible de charger les commentaires.</p>';
                });
        }

        /**
         * Soumet un nouveau commentaire pour un article spécifique.
         */
        function submitComment(articleId) {
            const authorInput = document.getElementById('comment-author');
            const textInput = document.getElementById('comment-text');
            const button = document.querySelector('#comment-form button');

            const commentData = {
                articleId: articleId,
                author: authorInput.value.trim(),
                commentText: textInput.value.trim()
            };

            if (!commentData.author || !commentData.commentText) {
                alert("Veuillez remplir votre nom et votre commentaire.");
                return;
            }

            button.disabled = true;
            button.textContent = 'Envoi...';

            callApi('postComment', { payload: commentData })
                .then(response => {
                    if (response.success) {
                        alert("Commentaire envoyé avec succès. Il apparaîtra après approbation.");
                        authorInput.value = '';
                        textInput.value = '';
                    } else {
                        alert('Erreur lors de la soumission du commentaire : ' + response.error);
                    }
                })
                .catch(err => alert('Erreur réseau. Veuillez réessayer.'))
                .finally(() => {
                    button.disabled = false;
                    button.textContent = 'Envoyer';
                });
        }
    </script>
</body>
</html>
