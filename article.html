<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - Lumière du Futur</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00BFFF;
            --fire-red: #FF4500;
            --night-blue: #0A0A23;
            --dark-card: #1a1a3a;
            --luminous-white: #FFFFFF;
            --text-secondary: #A9A9D4;
            --border-color: #2c2c54;
        }
        body {
            font-family: 'Open Sans', sans-serif; margin: 0; background-color: var(--night-blue);
            background-image: radial-gradient(var(--border-color) 1px, transparent 1px), radial-gradient(var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px; background-position: 0 0, 20px 20px; background-attachment: fixed; color: var(--luminous-white);
        }
        /* Correction: Le conteneur englobe toute la navigation */
        .header-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .container { max-width: 900px; margin: 0 auto; padding: 0 20px; } 

        header {
            background-color: rgba(10, 10, 35, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 10px 0;
            position: fixed;
            top: 0; left: 0; width: 100%;
            z-index: 1000; border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }
        nav { display: flex; justify-content: space-between; align-items: center;}
        .logo img { transition: transform 0.3s ease; }
        .logo:hover img { transform: scale(1.05); }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 30px; }
        nav a { color: var(--text-secondary); text-decoration: none; font-weight: 500; transition: color 0.3s; position: relative; padding-bottom: 5px; }
        nav ul a::after { content: ''; position: absolute; width: 0; height: 2px; bottom: 0; left: 50%; background: linear-gradient(90deg, var(--neon-blue), var(--fire-red)); transition: all 0.3s ease-in-out; }
        nav ul a:hover::after { width: 100%; left: 0; }
        nav a:hover, .nav-actions a.primary, nav a[style*="var(--luminous-white)"] { color: var(--luminous-white); }
        .menu-burger {
            display: none;
            width: 40px;
            height: 40px;
            flex-direction: column;
            justify-content: space-around;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background-color 0.3s, box-shadow 0.3s;
            z-index: 1002;
        }
        .menu-burger:hover {
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.5);
        }
        .menu-burger .bar { width: 100%; height: 2px; background-color: white; border-radius: 2px; }
        .nav-links-mobile {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(10, 10, 35, 0.95); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
            transform: translateX(-100%); transition: transform 0.4s ease-in-out;
            pointer-events: none; z-index: 1001;
        }
        .nav-links-mobile.active { transform: translateX(0); pointer-events: auto; }
        .nav-links-mobile-content { display: flex; flex-direction: column; gap: 30px; width: 100%; padding: 0 40px; box-sizing: border-box; }
        .nav-links-mobile a {
            color: var(--luminous-white); font-size: 18px; text-decoration: none;
            padding: 16px 10px; width: 100%; border-radius: 5px;
            transition: background-color 0.3s;
        }
        .nav-links-mobile a:hover { background-color: rgba(255, 255, 255, 0.1); }
        
        main { padding: 80px 0; }
        h1, h2, h3 { font-family: 'Orbitron', sans-serif; line-height: 1.2; }
        
        .article-header { text-align: center; margin-bottom: 40px; }
        .article-title { font-size: 3em; color: var(--neon-blue); margin-bottom: 15px; }
        .article-meta { color: var(--text-secondary); }
        .article-image { width: 100%; height: auto; max-height: 450px; object-fit: cover; border-radius: 10px; margin-bottom: 40px; }
        .article-content { line-height: 1.8; font-size: 1.1em; }
        
        /* --- Nouveaux styles pour le contenu de l'article --- */
        .article-content p { 
            margin-bottom: 1.5em; 
        }
        .article-content h3 { /* Pour les sous-titres comme "Constat", "Révélation" */
            margin-top: 2.5em;
            margin-bottom: 1em;
            color: var(--neon-blue);
            font-size: 1.4em;
            border-left: 3px solid var(--fire-red);
            padding-left: 15px;
        }
        .article-content blockquote { /* Pour le verset biblique */
            font-size: 1.2em;
            font-style: italic;
            margin: 2em 20px;
            padding: 20px;
            border-left: 5px solid var(--neon-blue);
            background-color: var(--dark-card);
            border-radius: 0 8px 8px 0;
        }
        .article-content blockquote footer {
            font-style: normal;
            font-size: 0.8em;
            text-align: right;
            color: var(--text-secondary);
            margin-top: 10px;
        }
        .cle-lecture { /* Pour la "clé de lecture" */
            background-color: rgba(44, 44, 84, 0.5);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin: 2em 0;
            text-align: center;
            font-style: italic;
        }

        /* --- Nouveaux styles pour les boutons de partage --- */
        .share-section {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }
        .share-section h3 {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 1.2em;
        }
        .share-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: opacity 0.3s;
            /* Ajout pour le formulaire de commentaire */
            cursor: pointer; 
        }
        .share-btn:hover { opacity: 0.85; }
        .share-btn.facebook { background-color: #1877F2; }
        .share-btn.whatsapp { background-color: #25D366; }

        /* --- Styles pour la section des commentaires --- */
        .comments-section {
            background-color: var(--dark-card);
            padding: 30px;
            border-radius: 10px;
            margin-top: 60px;
        }
        .comments-section h2 {
            color: var(--luminous-white);
            margin-bottom: 30px;
            text-align: center;
        }
        .comment-item {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 0;
        }
        .comment-item:last-child {
            border-bottom: none;
        }
        .comment-author {
            font-weight: bold;
            color: var(--neon-blue);
            margin-bottom: 5px;
        }
        .comment-date {
            font-size: 0.85em;
            color: var(--text-secondary);
        }

        /* Styles pour le formulaire de commentaire */
        .comment-form {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .comment-form label {
            color: var(--luminous-white);
            font-weight: 600;
        }
        .comment-form input[type="text"],
        .comment-form textarea {
            background-color: #2c2c54;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 10px 15px;
            color: var(--luminous-white);
            font-family: 'Open Sans', sans-serif;
            font-size: 1em;
        }
        .comment-form textarea { min-height: 100px; }
        /* Styles pour le skeleton loader de l'article */
        .skeleton-article .skeleton-line {
            height: 1em;
            background-color: #2c2c54;
            border-radius: 4px;
            margin: 0 auto 15px auto;
            animation: pulse 1.5s infinite ease-in-out;
        }
        .skeleton-article .title { height: 2.5em; width: 70%; margin-bottom: 20px; }
        .skeleton-article .meta { height: 1em; width: 40%; margin-bottom: 40px; }
        .skeleton-article .image { height: 400px; width: 100%; background-color: #2c2c54; border-radius: 10px; margin-bottom: 40px; animation: pulse 1.5s infinite ease-in-out; }
        .skeleton-article .text { width: 100%; }
        .skeleton-article .text.short { width: 80%; }

        @keyframes pulse {
            0% { background-color: #2c2c54; }
            50% { background-color: #3a3a6a; }
            100% { background-color: #2c2c54; }
        }

        /* MEDIA QUERIES pour le mobile */
        @media (max-width: 768px) {
            nav ul.desktop-links {
                display: none;
            }
            .menu-burger {
                display: flex; /* Afficher le bouton burger */
            }
            /* Correction: Supprimer le conteneur du header sur mobile si non nécessaire */
            .header-container { padding: 0 10px; } 
            
            .article-title {
                font-size: 2em; /* Réduire la taille du titre sur mobile */
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <nav>
                <a href="index.html" class="logo"><img src="r/LOGO.svg" alt="Logo Église Évangélique de Dakar" style="height: 50px; vertical-align: middle;"/></a>
                <ul class="desktop-links" id="desktop-nav-links">
                    </ul>
                <div class="nav-actions">
                    <div id="nav-qrcode-container" style="display: none;">
                        <img src="r/qr-code-icon.svg" id="nav-qrcode-icon" alt="QR Code" style="height: 24px; cursor: pointer;" onclick="toggleQrPopup()">
                        <div id="nav-qrcode-popup">
                            <img id="nav-qrcode-img" src="" alt="Votre QR Code" style="width: 100%; height: auto;">
                        </div>
                    </div>
                    <div class="menu-burger" onclick="toggleMobileMenu()"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
                </div>
            </nav>
        </div>
    </header>

    <div class="nav-links-mobile" id="mobile-menu">
        <div class="nav-links-mobile-content">
            </div>
    </div>

    <main class="container" id="article-container">
        </main>

    <footer>
        <div class="container footer-grid">
            <div class="footer-col">
                <img src="r/LOGO.svg" alt="Logo Lumière du Futur" class="footer-logo">
                <p>Annoncer l'Évangile, former des disciples et manifester l'amour de Christ à Dakar et au-delà.</p>
            </div>
            <div class="footer-col">
                <h4>Navigation</h4>
                <ul id="footer-nav-links">
                    </ul>
            </div>
            <div class="footer-col">
                <h4>Contactez-nous</h4>
                <p>Rue 11, Villa 4237 Amitié II<br>BP : 3816, Dakar 18523<br>Téléphone : 33 824 52 94</p>
            </div>
        </div>
        <div class="footer-bottom"><p>&copy; 2024 Église Évangélique de Dakar. Tous droits réservés.</p></div>
    </footer>

    <script src="config.js"></script>
    <script src="main.js"></script>
    <script>
        // --- DONNÉES DE NAVIGATION CENTRALISÉES ---
        const NAV_LINKS = [
            { href: "index.html", text: "Accueil" },
            { href: "apropos.html", text: "À Propos" },
            { href: "ministeres.html", text: "Ministères" },
            { href: "evenements.html", text: "Événements" },
            { href: "carrieres.html", text: "Ateliers" }, // Conservé le href "carrieres"
            { href: "ressources.html", text: "Ressources" },
            { href: "live.html", text: "Live" },
            { href: "Boutique.html", text: "Faire un Don" }, // Conservé le href "Boutique"
            { href: "index.html#contact", text: "Contact" }
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('article-container');
            const urlParams = new URLSearchParams(window.location.search);
            const articleId = urlParams.get('id');

            // --- CORRECTION 1: Chargement et génération des menus ---
            generateNavLinks();
            
            // Afficher le skeleton loader
            container.innerHTML = `
                <div class="skeleton-article">
                    <div class="skeleton-line title"></div>
                    <div class="skeleton-line meta"></div>
                    <div class="skeleton-image"></div>
                    <div class="skeleton-line text"></div>
                    <div class="skeleton-line text"></div>
                    <div class="skeleton-line text short"></div>
                    <br>
                    <div class="skeleton-line text"></div>
                    <div class="skeleton-line text short"></div>
                </div>
            `;

            if (!articleId) {
                container.innerHTML = '<p class="loading-message">Erreur : Aucun article spécifié.</p>';
                return;
            }

            // Assurez-vous que la fonction callApi est définie dans main.js ou config.js
            if (typeof callApi === 'undefined') {
                 console.error("La fonction callApi n'est pas définie. Assurez-vous que config.js et main.js sont chargés correctement.");
                 container.innerHTML = '<p class="loading-message">Erreur interne : La connexion à l\'API n\'est pas configurée.</p>';
                 return;
            }

            callApi('getBlogPostById', { id: articleId })
                .then(data => {
                    if (data.success && data.post) {
                        const post = data.post;
                        document.title = `${post.Titre} - Lumière du Futur`;

                        const postDate = new Date(post.Date).toLocaleDateString('fr-FR', {
                            day: 'numeric', month: 'long', year: 'numeric'
                        });

                        // --- CORRECTION 2: Remplacement des retours à la ligne par formatage HTML sémantique ---
                        const formattedContent = formatContent(post.Contenu);

                        container.innerHTML = `
                            <article>
                                <header class="article-header">
                                    <h1 class="article-title">${post.Titre}</h1>
                                    <p class="article-meta">Par ${post.Auteur} • ${postDate}</p>
                                </header>
                                <img src="${post.ImageURL}" alt="Image pour ${post.Titre}" class="article-image">
                                <div class="article-content">
                                    ${formattedContent}
                                </div>
                                <footer class="share-section">
                                    <h3>Partager cet article</h3>
                                    <div class="share-buttons">
                                        <a id="share-facebook" href="#" target="_blank" class="share-btn facebook">Facebook</a>
                                        <a id="share-whatsapp" href="#" target="_blank" class="share-btn whatsapp">WhatsApp</a>
                                    </div>
                                </footer>

                                <section class="comments-section">
                                    <h2>Commentaires</h2>
                                    <div id="comments-list">
                                        <p style="text-align: center; color: var(--text-secondary);">Chargement des commentaires...</p>
                                    </div>
                                    <form id="comment-form" class="comment-form">
                                        <h3>Laisser un commentaire</h3>
                                        <label for="comment-author">Votre nom :</label>
                                        <input type="text" id="comment-author" name="author" required>
                                        <label for="comment-text">Votre commentaire :</label>
                                        <textarea id="comment-text" name="commentText" required></textarea>
                                        <button type="submit" class="share-btn" style="background: var(--neon-blue); border: none;">Envoyer</button>
                                    </form>
                                </section>
                            </article>
                        `;

                        // Logique pour mettre à jour les liens de partage
                        const pageUrl = window.location.href;
                        const shareText = encodeURIComponent(`Découvrez cet article : "${post.Titre}"`);

                        document.getElementById('share-facebook').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}`;
                        document.getElementById('share-whatsapp').href = `https://api.whatsapp.com/send?text=${shareText} ${encodeURIComponent(pageUrl)}`;

                        // Charger les commentaires et attacher l'événement au formulaire
                        loadComments(articleId);
                        document.getElementById('comment-form').addEventListener('submit', function(event) {
                            event.preventDefault();
                            submitComment(articleId);
                        });

                    } else {
                        container.innerHTML = `<p class="loading-message">Erreur : Article non trouvé. (${data.error || ''})</p>`;
                    }
                })
                .catch(error => {
                    console.error('Erreur:', error);
                    container.innerHTML = '<p class="loading-message">Impossible de charger l\'article. Veuillez réessayer plus tard.</p>';
                });
        });

        // --- NOUVELLE FONCTION: Formatage sémantique du contenu brut ---
        /**
         * Convertit le contenu texte brut du Sheets en HTML sémantique.
         * Assume que les sous-titres sont précédés de '###' et les citations de '>'.
         * @param {string} content - Le contenu de l'article brut.
         * @returns {string} Le contenu formaté en HTML.
         */
        function formatContent(content) {
            const lines = content.trim().split('\n');
            let html = '';
            let inParagraph = false;

            lines.forEach(line => {
                line = line.trim();
                if (line.startsWith('###')) {
                    // Sous-titre
                    if (inParagraph) { html += '</p>'; inParagraph = false; }
                    html += `<h3>${line.substring(3).trim()}</h3>`;
                } else if (line.startsWith('>')) {
                    // Blockquote
                    if (inParagraph) { html += '</p>'; inParagraph = false; }
                    // Simple gestion de citation (peut être améliorée pour le footer)
                    const citation = line.substring(1).trim().split('--');
                    const text = citation[0].trim();
                    const source = citation[1] ? `<footer>${citation[1].trim()}</footer>` : '';
                    html += `<blockquote>${text}${source}</blockquote>`;
                } else if (line.length > 0) {
                    // Paragraphe
                    if (!inParagraph) { html += '<p>'; inParagraph = true; }
                    html += line + ' ';
                } else {
                    // Ligne vide (ferme le paragraphe)
                    if (inParagraph) { html += '</p>'; inParagraph = false; }
                }
            });

            // Fermer le dernier paragraphe si nécessaire
            if (inParagraph) { html += '</p>'; }

            return html;
        }

        // --- NOUVELLE FONCTION: Génération centralisée des liens de navigation ---
        function generateNavLinks() {
            const desktopNav = document.getElementById('desktop-nav-links');
            const mobileContent = document.querySelector('#mobile-menu .nav-links-mobile-content');
            const footerNav = document.getElementById('footer-nav-links');

            // Générer pour le desktop et le pied de page
            NAV_LINKS.forEach(link => {
                const desktopItem = document.createElement('li');
                desktopItem.innerHTML = `<a href="${link.href}">${link.text}</a>`;
                desktopNav.appendChild(desktopItem);
                
                const footerItem = document.createElement('li');
                footerItem.innerHTML = `<a href="${link.href}">${link.text}</a>`;
                footerNav.appendChild(footerItem);
            });

            // Générer pour le mobile
            NAV_LINKS.forEach(link => {
                const mobileLink = document.createElement('a');
                mobileLink.href = link.href;
                mobileLink.textContent = link.text;
                mobileLink.onclick = toggleMobileMenu; // Fermer le menu après un clic
                mobileContent.appendChild(mobileLink);
            });
        }

        // Assurez-vous que cette fonction est dans main.js ou définie globalement
        function toggleMobileMenu() {
            const mobileMenu = document.getElementById('mobile-menu');
            mobileMenu.classList.toggle('active');
        }

        /**
         * Charge et affiche les commentaires pour un article spécifique.
         * @param {string} articleId - L'ID de l'article.
         */
        function loadComments(articleId) {
            const commentsList = document.getElementById('comments-list');
            commentsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Chargement des commentaires...</p>';

            // CORRECTION: Assurer la cohérence des noms de champs
            callApi('getComments', { articleId: articleId })
                .then(data => {
                    commentsList.innerHTML = ''; // Vider le message de chargement
                    // CORRECTION: data.comments doit être un tableau d'objets comme dans Sheets (ex: {Auteur: '...', Commentaire: '...', Timestamp: '...'})
                    if (data.success && data.comments && data.comments.length > 0) {
                        data.comments.filter(c => c.Statut === 'Approuvé').forEach(comment => { // Ajout du filtre Statut
                            const commentElement = document.createElement('div');
                            commentElement.classList.add('comment-item');
                            commentElement.innerHTML = `
                                <p class="comment-author">${comment.Auteur || 'Anonyme'}</p>
                                <p>${comment.Commentaire}</p>
                                <p class="comment-date">${new Date(comment.Timestamp).toLocaleDateString('fr-FR', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</p>
                            `;
                            commentsList.appendChild(commentElement);
                        });
                        if (data.comments.filter(c => c.Statut === 'Approuvé').length === 0) {
                            commentsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Aucun commentaire approuvé pour le moment. Soyez le premier !</p>';
                        }
                    } else {
                        commentsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Aucun commentaire pour le moment. Soyez le premier !</p>';
                    }
                })
                .catch(error => {
                    console.error('Erreur lors du chargement des commentaires:', error);
                    commentsList.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">Impossible de charger les commentaires.</p>';
                });
        }

        /**
         * Soumet un nouveau commentaire pour un article spécifique.
         * @param {string} articleId - L'ID de l'article.
         */
        function submitComment(articleId) {
            const authorInput = document.getElementById('comment-author');
            const textInput = document.getElementById('comment-text');
            const button = document.querySelector('#comment-form button');

            const commentData = {
                // CORRECTION: Les noms de champs correspondent aux colonnes attendues dans Apps Script
                articleId: articleId,
                author: authorInput.value.trim(),
                commentText: textInput.value.trim()
            };

            if (!commentData.author || !commentData.commentText) {
                alert("Veuillez remplir votre nom et votre commentaire.");
                return;
            }

            button.disabled = true;
            button.textContent = 'Envoi...';

            callApi('postComment', { payload: commentData })
                .then(response => {
                    if (response.success) {
                        alert("Commentaire envoyé avec succès. Il apparaîtra après approbation.");
                        authorInput.value = '';
                        textInput.value = '';
                        // Ne pas recharger les commentaires, car le nouveau commentaire n'est pas encore "Approuvé"
                    } else {
                        alert('Erreur lors de la soumission du commentaire : ' + response.error);
                    }
                })
                .catch(err => alert('Erreur réseau. Veuillez réessayer.'))
                .finally(() => {
                    button.disabled = false;
                    button.textContent = 'Envoyer';
                });
        }
    </script>
</body>
</html>
